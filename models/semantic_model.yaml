# 星宝语料场景查询系统 — 语义模型定义
# 用于 Moss 翻译自然语言为 SQL 时查询的表结构知识
# 版本：1.0

version: "1.0"
table_name: data
source: /root/All_data_ch_full.parquet
total_rows: "动态（查询时从 engine.row_count 获取）"

columns:
  # ===== 核心标识 =====
  - name: 场景ID
    type: BIGINT
    description: "每个独立购药场景的唯一ID，做去重计数时必须用 COUNT(DISTINCT 场景ID)"
    sample: null
    keywords: []
    tags: [id, dedup]

  - name: 疾病名称
    type: VARCHAR
    description: "进店顾客主诉疾病或购药对应疾病（呼吸系统分类）"
    sample: "呼吸系统疾病-感冒"
    keywords: ["感冒", "咳嗽", "鼻炎", "发烧", "头痛"]
    tags: [disease, dimension, filter]

  # ===== 店员 & 门店 =====
  - name: 店员ID
    type: BIGINT
    description: "药信系统上的店员ID"
    sample: null
    keywords: []
    tags: [staff]

  - name: 门店ID
    type: BIGINT
    description: "药信系统上的门店ID"
    sample: null
    keywords: []
    tags: [store]

  # ===== 交易 =====
  - name: 交易是否达成
    type: VARCHAR
    description: "是否达成交易：是/否"
    sample: null
    keywords: ["成交", "达成", "交易"]
    tags: [deal, filter]

  - name: 交易失败原因
    type: VARCHAR
    description: "未达成交易的原因"
    sample: null
    keywords: []
    tags: [deal]

  # ===== 药品字段（JSON数组字符串） =====
  - name: 顾客点名药品
    type: VARCHAR
    description: "顾客点名购买的药品(JSON数组字符串)，可用 CONTAINS 或 LIKE 模糊匹配"
    sample: null
    keywords: ["点名", "指名"]
    tags: [drug, json, filter]

  - name: 场景提及药品
    type: VARCHAR
    description: "场景中提及的药品(JSON数组字符串)"
    sample: null
    keywords: ["提及"]
    tags: [drug, json, filter]

  - name: 订单药品
    type: VARCHAR
    description: "实际成交的药品(JSON数组字符串)"
    sample: null
    keywords: ["订单", "成交"]
    tags: [drug, json, filter]

  # ===== 药师行为 =====
  - name: 是否问症
    type: VARCHAR
    description: "药师是否问症：是/否"
    sample: null
    keywords: ["问症"]
    tags: [behavior, filter]

  - name: 是否关键信息到达
    type: VARCHAR
    description: "药师是否传递关键信息：是/否"
    sample: null
    keywords: ["关键信息", "信息到达"]
    tags: [behavior, filter]

  - name: 问症表现
    type: VARCHAR
    description: "药师问症的具体表现文本"
    sample: null
    keywords: []
    tags: [behavior, text]

  - name: 关键信息表现
    type: VARCHAR
    description: "药师传递关键信息的具体表现文本"
    sample: null
    keywords: []
    tags: [behavior, text]

  - name: 订单达成表现
    type: VARCHAR
    description: "交易达成的表现文本"
    sample: null
    keywords: []
    tags: [behavior, text]

  - name: 患者关键信息
    type: VARCHAR
    description: "顾客主诉核心信息(JSON数组)"
    sample: null
    keywords: []
    tags: [patient, json]

  # ===== 时间 =====
  - name: 场景时长
    type: BIGINT
    description: "场景对话时长(秒)"
    sample: null
    keywords: ["时长", "用时"]
    tags: [duration, metric]

  - name: 会话ID
    type: BIGINT
    description: "场景所属的原始会话编号，同一会话可能包含多个场景"
    sample: null
    keywords: []
    tags: [session]

  - name: 会话开始时间
    type: VARCHAR
    description: "场景所在会话的开始时间"
    sample: null
    keywords: []
    tags: [time]

  - name: 场景从会话的开始时间
    type: VARCHAR
    description: "场景在会话内的偏移开始时间(HH:mm:ss)"
    sample: null
    keywords: []
    tags: [time]

  - name: 场景自然开始时间
    type: VARCHAR
    description: "场景开始时间 yyyy-MM-dd HH:mm:ss"
    sample: null
    keywords: []
    tags: [time]

  - name: 场景日期
    type: VARCHAR
    description: "场景的日期"
    sample: null
    keywords: []
    tags: [date]

  - name: ydate
