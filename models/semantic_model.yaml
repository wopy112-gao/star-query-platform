    tags: [geo, dimension]

  - name: 门店
    type: VARCHAR
    description: "药店名称"
    sample: null
    keywords: ["门店", "药店"]
    tags: [geo, dimension]

  # ===== 活动 =====
  - name: 是否场景下活动推荐
    type: VARCHAR
    description: "药师是否推荐活动：是/否"
    sample: null
    keywords: ["活动推荐"]
    tags: [activity, filter]

  - name: 活动是否参与
    type: VARCHAR
    description: "顾客是否参与活动：是/否"
    sample: null
    keywords: ["活动参与"]
    tags: [activity, filter]

  - name: 活动时间占比
    type: VARCHAR
    description: "活动耗时占场景比例(字符串)"
    sample: null
    keywords: []
    tags: [activity]

  - name: 活动满意度
    type: VARCHAR
    description: "顾客对活动的满意度"
    sample: null
    keywords: []
    tags: [activity]

  - name: 活动介绍
    type: VARCHAR
    description: "门店活动的主要信息文本"
    sample: null
    keywords: []
    tags: [activity, text]

  # ===== 数据质量 =====
  - name: 场景解析来源
    type: VARCHAR
    description: "场景数据的解析来源：AI自动化/人工"
    sample: null
    keywords: []
    tags: [quality]

  # ===== 2026-06-11 新增字段 =====
  - name: 店员提及药品JSON
    type: VARCHAR
    description: "对话中药师说出的药品名(JSON数组)"
    sample: null
    keywords: []
    tags: [drug, json]

  - name: 店员推荐药品JSON
    type: VARCHAR
    description: "对话中药师主动推荐给顾客的药品(JSON数组)"
    sample: null
    keywords: []
    tags: [drug, json, recommend]

  - name: 用药人年龄分层
    type: VARCHAR
    description: "用药人的大致年龄段，如：青壮年、老年人、儿童"
    sample: null
    keywords: ["年龄分层", "年龄段"]
    tags: [customer, dimension, filter]

  - name: 联合用药动作
    type: BIGINT
    description: "店员是否做了联合推荐动作：1=是,0=否（注意区别于'是否联合用药'，后者是AI判断结论）"
    sample: null
    keywords: ["联合用药动作"]
    tags: [combo, filter]

  - name: 推荐的联合用药JSON
    type: VARCHAR
    description: "店员推荐联合用药的具体药品组合(JSON)"
    sample: null
    keywords: []
    tags: [combo, json]

  - name: 综合置信度评分
    type: DOUBLE
    description: "音转文后的数据整体置信度评分，0~1之间，越高越好"
    sample: null
    keywords: ["置信度"]
    tags: [quality, filter]

  - name: 场景完整度
    type: VARCHAR
    description: "交易场景数据完整度分值"
    sample: null
    keywords: []
    tags: [quality]

  - name: 业务置信度
    type: VARCHAR
    description: "业务层面的置信度评分"
    sample: null
    keywords: ["业务置信度"]
    tags: [quality, filter]

  - name: 是否商用
    type: BIGINT
    description: "数据是否达到商用标准：1=是,0=否（过滤高质量数据）"
    sample: null
    keywords: ["商用", "数据质量"]
    tags: [quality, filter]

  - name: 切割置信度分值
    type: DOUBLE
    description: "对话切割算法的置信度分值，0~1之间"
    sample: null
    keywords: []
    tags: [quality]

  - name: 切割完整度分值
    type: DOUBLE
    description: "对话切割算法的完整度分值，0~1之间"
    sample: null
    keywords: []
    tags: [quality]

  # ===== 2026-07-09 彩蛋任务字段 =====
  - name: 彩蛋任务ID
    type: BIGINT
    description: "彩蛋任务ID，>0 表示该场景命中彩蛋疾病分母，=0 表示未命中"
    sample: null
    keywords: ["彩蛋"]
    tags: [egg_task]

  - name: 彩蛋药品名称
    type: VARCHAR
    description: "彩蛋任务的关联药品名称"
    sample: null
    keywords: []
    tags: [egg_task]

  - name: 彩蛋标题
    type: VARCHAR
    description: "彩蛋任务的标题"
    sample: null
    keywords: []
    tags: [egg_task]

  - name: 是否分子1=是(发分)
    type: BIGINT
    description: "是否命中彩蛋分子（即店员提及并传递了关键信息）：1=是(发分),0=否"
    sample: null
    keywords: ["分子", "发分"]
    tags: [egg_task, filter]

  - name: 命中原因
    type: VARCHAR
    description: "彩蛋任务的命中原因说明，包含分母匹配依据和分子条件判断依据"
    sample: null
    keywords: []
    tags: [egg_task, text]

business_rules:
  - text: "场景ID去重：统计场景数必须用 COUNT(DISTINCT 场景ID)"
  - text: "药品匹配：查询药品相关时，需同时检查 顾客点名药品、场景提及药品、订单药品 三个字段（用 LIKE 或 CONTAINS）"
  - text: "疾病名称过滤：疾病名称格式为'呼吸系统疾病-{子类}'，筛选时用 LIKE '呼吸系统疾病-{关键词}%'"
  - text: "交易达成：交易是否达成='是' 表示成交"
  - text: "问症率 = COUNT(DISTINCT 场景ID WHERE 是否问症='是') / COUNT(DISTINCT 场景ID)"
  - text: "联合用药率：建议用新字段'联合用药动作'='1' 计算实际联合推荐率，旧字段'是否联合用药'='是' 为AI判断结论"
  - text: "数据质量：可用'是否商用'='1' 过滤高质量数据，用'综合置信度评分' 评估数据可靠性"
  - text: "店员推荐分析：'店员推荐药品JSON' 记录主动推荐，'顾客点名药品' 记录顾客指名，两者对比可分析店员影响力"
  - text: "年龄段分析：'用药人年龄分层' 可按青壮年/老年人/儿童等分层分析购药行为差异"
  - text: "转化率：分子必须是分母的子集，确保 ≤100%"
  - text: "彩蛋任务：'彩蛋任务ID'>0 表示命中分母（符合彩蛋疾病条件），'是否分子1=是(发分)'=1 才是真正命中（店员提及且传递了关键信息）"
  - text: "彩蛋命中率 = COUNT(彩蛋任务ID>0 AND 是否分子1=是(发分)=1) / COUNT(彩蛋任务ID>0)"

query_tips:
  - text: "查询药品相关时，用 CONTAINS(字段名, '药品名') 或 LIKE '%药品名%'"
  - text: "时间维度用 ydate 字段过滤，格式 'YYYY-MM-DD'"
  - text: "地域维度用 省份、城市 字段"
  - text: "做 TOP N 排序时用 ORDER BY ... DESC LIMIT N"
  - text: "统计占比时用 COUNT(DISTINCT 场景ID) * 1.0 / (SELECT COUNT(DISTINCT 场景ID) FROM data)"
  - text: "联合用药分析：优先用'联合用药动作'='1' 代表实际联合推荐行为"
  - text: "店员推荐分析：`CONTAINS(店员推荐药品JSON, '药品名')` 可查哪些场景店员推荐了指定药品"
  - text: "置信度过滤：`综合置信度评分` 和 `是否商用`='1' 可用于过滤高质量数据"
  - text: "彩蛋分析：查询彩蛋场景时用 `彩蛋任务ID`>0 过滤分母场景，`是否分子1=是(发分)`=1 过滤分子命中场景"
  - text: "彩蛋命中原因分析：`命中原因` 字段包含详细的分子/分母判断依据文本"
