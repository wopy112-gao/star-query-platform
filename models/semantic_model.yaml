    tags: [date, filter, time]

  # ===== 联合用药 =====
  - name: 是否联合用药
    type: VARCHAR
    description: "药师是否推荐联合用药：是/否"
    sample: null
    keywords: ["联合用药"]
    tags: [combo, filter]

  - name: 联合用药合理性
    type: VARCHAR
    description: "联合用药是否合理：是/否"
    sample: null
    keywords: []
    tags: [combo]

  # ===== 顾客 =====
  - name: 顾客性别
    type: VARCHAR
    description: "顾客性别：男/女/不可识别"
    sample: null
    keywords: ["性别", "男", "女"]
    tags: [customer, filter, dimension]

  - name: 顾客年龄
    type: VARCHAR
    description: "顾客年龄(混用：定性/区间/具体数字)"
    sample: null
    keywords: ["年龄"]
    tags: [customer]

  - name: 顾客信任度
    type: VARCHAR
    description: "顾客对药师的信任评估"
    sample: null
    keywords: ["信任"]
    tags: [customer, filter, dimension]

  # ===== 地域 =====
  - name: 省份
    type: VARCHAR
    description: "药店所在省份"
    sample: null
    keywords: ["省", "省份"]
    tags: [geo, dimension, filter]

  - name: 城市
    type: VARCHAR
    description: "药店所在城市"
    sample: null
    keywords: ["城市", "市"]
    tags: [geo, dimension, filter]

  - name: 连锁
    type: VARCHAR
    description: "药店所属连锁品牌"
    sample: null
